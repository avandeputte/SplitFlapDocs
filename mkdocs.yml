site_name: SplitFlap
site_url: https://splitflap.iothing.net/docs/
site_dir: site/docs
site_description: Build a mechanical split-flap display and drive it with live content — the complete guide, from a bare board to a message on the wall.
repo_url: https://github.com/avandeputte/SplitFlapGateway
repo_name: GitHub
edit_uri: ""
copyright: Software © Alex Van de Putte · Hardware © Adam G Makes · Documentation CC BY-NC-SA 4.0

theme:
  name: material
  custom_dir: overrides
  language: en
  favicon: favicon.svg
  # Dark only, in the landing page's palette (docs/stylesheets/extra.css). The brand in the
  # header is overrides/partials/logo.html; it links back to the landing page (extra.homepage).
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

extra:
  homepage: https://splitflap.iothing.net/
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/avandeputte/SplitFlapGateway
      name: SplitFlapGateway on GitHub

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - github-callouts

plugins:
  - search

not_in_nav: |
  Gateway.md
  Matrix-Portal-Gateway.md

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

